services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: monitor
      POSTGRES_PASSWORD: monitor
      POSTGRES_DB: api_monitor
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  # A throwaway Redis for the test suite only, so tests can never touch the development one.
  # Start it with: docker compose --profile test up -d redis-test
  redis-test:
    image: redis:7-alpine
    profiles: ["test"]
    ports:
      - "6390:6379"

volumes:
  pgdata:
  redisdata: